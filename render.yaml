services:
  # Go backend: API, WebSocket, automation, OCR, and the PWA frontend
  - type: web
    name: betelite-backend
    runtime: docker
    region: oregon
    plan: free # upgrade to "starter" before launch so timers and payouts never sleep
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: GO_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ALLOWED_ORIGINS
        value: "https://betelite-alvn.onrender.com,https://okafordavis.github.io"
      - key: APP_URL
        value: https://betelite-alvn.onrender.com
      - key: ADMIN_EMAIL
        value: okafordavis8@gmail.com
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash,gemini-3.5-flash"
      - key: FIREBASE_PROJECT_ID
        value: betelite-crest
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OCR_PROVIDERS
        value: "gemini,claude"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY_GH
        sync: false
      - key: PAYSTACK_SECRET_KEY_GH
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: FORCE_UPDATE
        value: "false"
